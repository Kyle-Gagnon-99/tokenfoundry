[workspace]
resolver = "3"
members = ["cli", "core", "json-spanned"]

[workspace.package]
authors = ["Kyle Gagnon"]
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
miette = "5.5"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "yaml", "json", "env"] }
